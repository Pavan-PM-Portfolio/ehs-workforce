<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EHS Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;--surface:#FFFFFF;--surface-2:#F6F7F9;--surface-3:#ECEEF1;
  --ink:#14161A;--ink-2:#3A3F47;--muted:#6B7280;--faint:#9AA1AC;
  --line:#E6E7EB;--line-2:#EFF0F3;
  --accent:#0F6CBD;--accent-ink:#0C5A9E;--accent-hover:#0C5A9E;--accent-press:#094A82;
  --navy:#101A33;--navy-2:#1B294B;--navy-line:#2C3B60;
  --good:#0E8F5A;--warn:#B96A00;--crit:#CE2F26;
  --shadow-sm:2px 2px 0 rgba(16,26,51,.05);--shadow:4px 4px 0 rgba(16,26,51,.09);
  --shadow-lg:7px 7px 0 rgba(16,26,51,.12);
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:0;background:none}
input,select{font-family:inherit}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}

.code-tile{display:inline-grid;place-items:center;font-family:var(--mono);font-weight:700;
  letter-spacing:-.02em;color:#fff;flex:none;line-height:1}
.btn{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;border-radius:4px;
  padding:9px 16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  transition:transform .1s,box-shadow .1s,background .12s}
.btn:hover{background:var(--surface-2)}
.btn.accent{background:var(--accent);color:#fff;border:1px solid var(--accent);font-weight:600;border-radius:4px;
  box-shadow:0 1px 2px rgba(12,90,158,.25),0 1px 1px rgba(0,0,0,.04)}
.btn.accent:hover{background:var(--accent-hover);border-color:var(--accent-hover);transform:none;box-shadow:0 2px 6px rgba(12,90,158,.3)}
.btn.accent:active{background:var(--accent-press);border-color:var(--accent-press);transform:translateY(.5px);box-shadow:0 1px 2px rgba(12,90,158,.25)}
.btn.sm{padding:6px 11px;font-size:12px}
.btn.accent.sm{box-shadow:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn .ico{width:15px;height:15px}
.sso-div{display:flex;align-items:center;gap:12px;margin:16px 0 14px;color:var(--faint);font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.sso-div::before,.sso-div::after{content:"";flex:1;height:1px;background:var(--line)}
.btn.msso{width:100%;justify-content:center;background:#fff;color:var(--ink);border:1px solid var(--ink);font-weight:700;padding:11px 16px;border-radius:4px}
.btn.msso:hover{background:var(--surface-2)}
.btn.msso svg.mslogo{width:16px;height:16px;flex:none}
.btn.danger{background:var(--crit);border:1px solid var(--crit);color:#fff;font-weight:700;border-radius:4px;box-shadow:none}
.btn.danger:hover{background:#B52A21;border-color:#B52A21;transform:none;box-shadow:none}
.warn-lead{font-size:13.5px;color:var(--ink-2);line-height:1.65;margin:0}
.warn-lead b{color:var(--ink);font-weight:700}
.warn-callout{border:1px solid #CE2F2626;background:#CE2F260A;border-radius:6px;padding:12px 14px;margin-top:14px}
.warn-callout.blue{border-color:#0F6CBD26;background:#0F6CBD0A}
.warn-li{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--ink-2);padding:3px 0;line-height:1.55}
.warn-li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--crit);flex:none;margin-top:6.5px}
.warn-callout.blue .warn-li::before{background:var(--accent)}
.ico{width:16px;height:16px;flex:none;stroke:currentColor;stroke-width:1.75;fill:none;
  stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;
  font-weight:600;letter-spacing:.02em;padding:3px 8px;border:1px solid var(--line);color:var(--muted);
  text-transform:uppercase}
.chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.live{color:var(--good);border-color:#bfe3d0}
.chip.planned{color:var(--faint);border-color:var(--line)}
.chip.master{color:var(--accent);border-color:#bcd0f5}
.eyebrow{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint)}

/* ---------- LOGIN (full image, form in the open right space) ---------- */
.login{position:relative;min-height:100vh;background:#FBF9FD;overflow:hidden}
.brand{position:absolute;inset:0;background:#FBF9FD;background-image:linear-gradient(rgba(16,26,51,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(16,26,51,.05) 1px,transparent 1px);background-size:44px 44px}
.corner-logo{position:absolute;top:26px;right:40px;z-index:5;height:30px;width:auto}
.formside{position:absolute;right:0;top:0;bottom:0;width:42%;min-width:360px;
  display:flex;align-items:center;justify-content:center;padding:0 5%;z-index:4}
.formcard{width:100%;max-width:338px}
.formcard h2{font-size:23px;font-weight:800;letter-spacing:-.02em}
.formcard .sub{color:var(--muted);margin-top:6px;margin-bottom:26px;font-size:13.5px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  color:var(--muted);margin-bottom:6px}
.field input,.field select{width:100%;padding:11px 13px;border:1px solid var(--line);background:var(--surface);
  font-size:14px;outline:none;transition:border-color .12s,box-shadow .12s}
.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,111,224,.13)}
.signin{width:100%;justify-content:center;padding:12px;margin-top:6px}
.formfoot{margin-top:22px;font-size:12px;color:var(--faint);text-align:center}
.err{background:#fdeceb;border:1px solid #f4c9c6;color:#9a2820;font-size:12.5px;padding:9px 12px;margin-bottom:14px}
@media(max-width:820px){.formside{width:100%;min-width:0;background:rgba(251,249,253,.94);padding:0 24px}
  .corner-logo{right:auto;left:24px}}

/* ---------- APP SHELL ---------- */
.shell{min-height:100vh;display:flex;flex-direction:column}
.home-grid{background:
  linear-gradient(rgba(16,26,51,.06) 1px,transparent 1px) 0 0/44px 44px,
  linear-gradient(90deg,rgba(16,26,51,.06) 1px,transparent 1px) 0 0/44px 44px,
  var(--bg)}
.topbar{height:60px;background:var(--surface);border-bottom:1px solid var(--ink);
  display:flex;align-items:center;gap:16px;padding:0 24px;position:sticky;top:0;z-index:40}
.tb-brand{display:flex;align-items:center;gap:11px;cursor:pointer}
.ehs-logo{display:block;height:24px;width:auto;flex:none}
.tb-glyph{width:30px;height:30px;flex:none;display:grid;place-items:center;border-radius:999px;background:var(--surface-3);color:var(--ink-2)}
.tb-glyph svg{width:18px;height:18px;display:block;margin-top:1px}
.acd-glyph{width:52px;height:52px;flex:none;display:grid;place-items:center;border-radius:999px;background:var(--surface-3);color:var(--ink-2)}
.acd-glyph svg{width:30px;height:30px;display:block;margin-top:2px}
.pa-av,.acd-glyph{cursor:pointer}
.dp-lb{position:fixed;inset:0;background:rgba(10,12,20,.82);z-index:700;display:none;align-items:center;justify-content:center;padding:24px}
.dp-lb.on{display:flex}
.dp-lb-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:16px}
.dp-lb-img{width:min(78vw,340px);height:min(78vw,340px);border-radius:999px;object-fit:cover;background:#fff;box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}
.dp-lb-name{color:#fff;font-size:16px;font-weight:600}
.dp-lb-btn{font-size:13px;font-weight:600;padding:9px 18px;border-radius:6px;border:1px solid #fff;background:#fff;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.dp-lb-btn svg{width:15px;height:15px}
.dp-lb-close{position:absolute;top:-12px;right:-12px;width:34px;height:34px;border-radius:999px;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:18px;cursor:pointer;display:grid;place-items:center}
.dp-lb-close:hover{background:rgba(255,255,255,.28)}
.tb-id{display:flex;flex-direction:column;justify-content:center;padding-left:15px;margin-left:3px;border-left:1px solid var(--line);cursor:pointer}
.tb-title{font-weight:700;font-size:15px;letter-spacing:-.01em;line-height:1.15}
.tb-sub{font-family:var(--mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:1px}
.av-sq{display:grid;place-items:center;font-family:'Inter',sans-serif;font-weight:600;flex:none;box-sizing:border-box}
.tb-crumb{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);
  padding-left:16px;margin-left:2px;border-left:1px solid var(--line)}
.tb-crumb .code-tile{width:24px;height:24px;font-size:9.5px}
.tb-crumb b{color:var(--ink);font-weight:600}
.tb-crumb .sep{color:var(--faint)}
.tb-spacer{flex:1}
.tb-link{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink-2);
  padding:7px 11px;border:0;border-radius:6px;cursor:pointer;transition:background .12s}
.tb-link:hover{background:var(--surface-2)}
.tb-link.on{color:var(--accent)}
.tb-tools-wrap{position:relative;flex:none}
.tb-tools-menu{position:absolute;top:calc(100% + 7px);right:0;z-index:640;min-width:250px;background:#fff;
  border:1px solid var(--line);border-radius:6px;box-shadow:0 22px 50px -18px rgba(16,26,51,.36);padding:6px;display:none}
.tb-tools-menu.on{display:block}
.tb-tools-menu .tm-h{font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);padding:8px 10px 6px}
.tb-tool{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer;text-decoration:none;color:inherit}
.tb-tool:hover{background:var(--surface-2)}
.tb-tool.cur{background:var(--surface-2)}
.tb-tool .tc{width:26px;height:26px;flex:none;display:grid;place-items:center;border-radius:6px;font-size:10px;font-weight:800;color:#fff}
.tb-tool .tn{font-size:12.8px;font-weight:600;line-height:1.2}
.tm-ico{width:26px;height:26px;flex:none;display:grid;place-items:center}
.tm-ico svg{width:22px;height:22px;display:block;overflow:visible}
/* Project Hub — ticks draw in sequence */
@keyframes ti-pm{0%,8%{stroke-dashoffset:9;opacity:0}22%,72%{stroke-dashoffset:0;opacity:1}86%,100%{stroke-dashoffset:9;opacity:0}}
.ti-pm-t{stroke-dasharray:9;animation:ti-pm 3.2s ease-in-out infinite}
.ti-pm-t:nth-of-type(2){animation-delay:.42s}
.ti-pm-t:nth-of-type(3){animation-delay:.84s}
/* Delivery Hub — truck rolls */
@keyframes ti-dh{0%,100%{transform:translateX(-1.6px)}50%{transform:translateX(1.6px)}}
@keyframes ti-dhw{to{transform:rotate(360deg)}}
.ti-dh-body{animation:ti-dh 2.4s ease-in-out infinite}
.ti-dh-w1{transform-origin:7.5px 17.5px;animation:ti-dhw 1.1s linear infinite}
.ti-dh-w2{transform-origin:17px 17.5px;animation:ti-dhw 1.1s linear infinite}
/* Sales Analytics — bars rise, trend cuts across */
@keyframes ti-sa{0%,100%{transform:scaleY(.35)}52%{transform:scaleY(1)}}
.ti-sa-b{transform-origin:center bottom;animation:ti-sa 2.8s ease-in-out infinite}
.ti-sa-b:nth-of-type(2){animation-delay:.16s}
.ti-sa-b:nth-of-type(3){animation-delay:.32s}
@keyframes ti-saa{0%,14%{stroke-dashoffset:24;opacity:0}44%,84%{stroke-dashoffset:0;opacity:1}96%,100%{stroke-dashoffset:24;opacity:0}}
.ti-sa-a{stroke-dasharray:24;animation:ti-saa 2.8s ease-out infinite}
/* Products & Licenses — shield draws, tick lands */
@keyframes ti-plr{0%,8%{stroke-dashoffset:58}40%,100%{stroke-dashoffset:0}}
.ti-pl-r{stroke-dasharray:58;animation:ti-plr 3.2s ease-out infinite}
@keyframes ti-plt{0%,26%{stroke-dashoffset:11}54%,82%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:11}}
.ti-pl-t{stroke-dasharray:11;animation:ti-plt 3.2s cubic-bezier(.5,0,.3,1) infinite}
/* Operations — gears counter-rotate */
@keyframes ti-oma{to{transform:rotate(360deg)}}
@keyframes ti-omb{to{transform:rotate(-360deg)}}
.ti-om-a{transform-origin:8.6px 9.4px;animation:ti-oma 6s linear infinite}
.ti-om-b{transform-origin:16.4px 16px;animation:ti-omb 4s linear infinite}
/* Coming soon */
.tb-tool.tb-soon{cursor:default}
.tb-tool.tb-soon:hover{background:none}
  color:var(--muted);background:var(--surface-3);border-radius:6px !important;padding:3px 7px;white-space:nowrap}
@media (prefers-reduced-motion:reduce){
  .ti-pm-t,.ti-dh-body,.ti-dh-w1,.ti-dh-w2,.ti-sa-b,.ti-sa-a,.ti-pl-r,.ti-pl-t,.ti-om-a,.ti-om-b{animation:none}
}
.tb-tool .tc-mark{background:none !important;padding:0}
.tb-tool .tc-mark img{height:19px;width:auto;display:block}
.tb-tool .cur-dot{margin-left:auto;font-size:10px;font-weight:700;color:var(--muted)}
.tb-tools-none{padding:14px 12px;font-size:12px;color:var(--muted);text-align:center}
.tb-acct{display:flex;align-items:center;gap:9px;padding:6px 8px;cursor:pointer;transition:background .12s}
.tb-acct:hover{background:var(--surface-3)}
.tb-acct .av-sq{width:30px;height:30px;font-size:11px}
.tb-acct .who{font-weight:600;font-size:12.5px;line-height:1.2}
.tb-acct .role{font-size:11px;color:var(--muted)}
.page{flex:1;padding:34px 24px 60px;max-width:1080px;width:100%;margin:0 auto}

/* home */
.home-head{margin-bottom:28px}
.home-head .eyebrow{margin-bottom:12px}
.home-head h1{font-size:30px;font-weight:800;letter-spacing:-.03em}
.home-head p{color:var(--muted);margin-top:8px;font-size:14.5px}
.tool-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.tool-card{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm);
  padding:22px;display:flex;flex-direction:column;gap:14px;cursor:pointer;
  transition:transform .14s,box-shadow .14s}
.tool-card:hover{transform:translate(-3px,-3px);box-shadow:var(--shadow-lg)}
.tc-top{display:flex;align-items:flex-start;gap:14px}
.tc-top .code-tile{width:48px;height:48px;font-size:16px;box-shadow:var(--shadow-sm)}
.tc-name{font-size:17px;font-weight:700;letter-spacing:-.01em}
.tc-tag{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:3px;
  text-transform:uppercase;letter-spacing:.03em}
.tc-desc{font-size:13.5px;color:var(--ink-2);line-height:1.55;flex:1}
.tc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:2px}
.tc-open{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--accent)}
.tool-card:hover .tc-open .ico{transform:translateX(2px)}
/* ===== animated home (blended, 3-up) ===== */
body{--sp:1}
@keyframes drawline{to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.28}}
@keyframes sbar{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
@keyframes smeter0{0%{transform:scaleX(0)}60%,100%{transform:scaleX(1)}}
@keyframes smeter1{0%{transform:scaleX(0)}18%{transform:scaleX(0)}72%,100%{transform:scaleX(1)}}
@keyframes smeter2{0%{transform:scaleX(0)}32%{transform:scaleX(0)}84%,100%{transform:scaleX(1)}}
@keyframes parc{0%{opacity:0;stroke-dashoffset:'+(2*Math.PI*30)+'}100%{opacity:1}}
@keyframes opsblink{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes opspulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes opsspin{to{transform:rotate(360deg)}}
@keyframes opsbar{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1)}}
@keyframes opsstore{0%{stroke-dashoffset:${CIRC}}60%,100%{stroke-dashoffset:${(CIRC*0.32).toFixed(1)}}}
@keyframes dpulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.14)}}
@keyframes dstk{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes pvend${i}
@keyframes pmmove{0%,10%{left:16px;top:30px}32%,46%{left:calc(33% + 4px);top:30px}68%,82%{left:calc(66% - 6px);top:30px}92%,100%{left:calc(66% - 6px);top:30px}}
@keyframes pmring{0%{stroke-dashoffset:${CIRC}}60%,100%{stroke-dashoffset:${(CIRC*0.31).toFixed(1)}}}
@keyframes sarea{0%,10%{opacity:0}45%,100%{opacity:1}}
.home2{width:100%;max-width:1240px;margin:0 auto;padding:48px 56px 96px}
.home2-head h1{font-size:34px;font-weight:800;letter-spacing:-.03em}
.home2-head p{color:var(--muted);font-size:15px;margin-top:6px;margin-bottom:38px}
.htgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:44px 40px}
.htile:nth-child(5){grid-column:1/2}  /* lone 5th tile left-aligned */
.htile{position:relative}
.ht-viz{cursor:default}
.ht-name-btn{cursor:pointer;font:inherit;line-height:1}
.ht-name-btn[aria-disabled="true"]{cursor:default}
.ht-viz{position:relative;aspect-ratio:512/300;border-radius:10px;overflow:hidden;transition:transform .18s;background:transparent}
.htile:not(.locked):hover .ht-viz{transform:translateY(-5px)}
/* Fixed-size design stage, scaled to fill the tile so internals never clip.
   Design canvas = 460x300; scaled up via transform to cover the tile width. */
.ht-stage{position:absolute;top:50%;left:50%;width:512px;height:300px;
  transform:translate(-50%,-50%) scale(var(--htscale,1));transform-origin:center}
.ht-viz [style*="background:#fff"]{box-shadow:0 8px 26px -14px rgba(16,26,51,.3)}
/* locked/planned tools: keep colour and motion, just gently dim + a soft veil */
.htile.locked .ht-viz{opacity:.9}
.htile.locked .ht-viz::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.28);pointer-events:none}
.ht-name{display:flex;align-items:center;justify-content:center;gap:8px;padding:20px 12px 0}
.ht-name .ht-name-btn{display:inline-flex;align-items:center;gap:8px;font-family:inherit;
  background:var(--accent);color:#fff;font-weight:600;font-size:14.5px;letter-spacing:-.005em;
  padding:9px 18px;border-radius:4px;border:1px solid var(--accent);
  box-shadow:0 1px 2px rgba(12,90,158,.25),0 1px 1px rgba(0,0,0,.04);transition:background .12s,box-shadow .12s,transform .1s}
.htile:not(.locked):hover .ht-name-btn{background:var(--accent-hover);border-color:var(--accent-hover);box-shadow:0 2px 6px rgba(12,90,158,.3)}
.htile:not(.locked):active .ht-name-btn{background:var(--accent-press);transform:translateY(.5px)}
/* locked/planned: neutral outlined chip so it reads as unavailable */
.htile.locked .ht-name-btn{background:var(--surface);color:var(--muted);border-color:var(--line);box-shadow:none}
.ht-lock{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);
  background:var(--surface-2);border:1px solid var(--line);padding:3px 9px;border-radius:999px}
.home2-foot{margin-top:56px;padding-top:26px;border-top:1px solid var(--line);
  text-align:center;color:var(--faint);font-size:12px;font-weight:600}
@media(max-width:1080px){.htgrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.htgrid{grid-template-columns:1fr}.home2{padding:32px 22px 64px}.ht-viz{height:240px}}

.tc-open .ico{width:15px;height:15px;transition:transform .14s}
.tc-role{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--faint)}
.emptytools{border:1px dashed var(--line);background:var(--surface-2);padding:48px 30px;text-align:center;
  color:var(--muted);font-size:14px}

/* ===== premium home: hero + tool sections ===== */


/* tool page */
.tool-head{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.tool-head .code-tile{width:44px;height:44px;font-size:15px;box-shadow:var(--shadow-sm)}
.tool-head h1{font-size:22px;font-weight:800;letter-spacing:-.02em}
.tool-head .th-tag{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:2px;
  text-transform:uppercase;letter-spacing:.03em}
.tool-head .th-actions{margin-left:auto;display:flex;gap:9px}

/* people & access */

/* segmented control */

/* modal */
.scrim{position:fixed;inset:0;background:rgba(16,26,51,.34);display:none;z-index:70;

.pa-list{max-height:640px;overflow-y:auto}

.pa-dh-em{font-size:12.5px;color:var(--muted);margin-top:5px}

.pa-ci{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}

.pa-rolerow{display:flex;align-items:center;justify-content:space-between;gap:20px}

/* ---- Zoho-style Users rebuild ---- */
.pa-av{flex:none;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-weight:700;

.pa-accrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-2)}

.pa-pwline{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.pa-fld{flex:1;min-width:220px}
.pa-fld label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);margin-bottom:6px}
.pa-fld input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;font-family:inherit;font-size:13px}
.pa-fld input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,111,224,.13)}
.pa-chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12.5px;color:var(--ink-2)}

.pa-chip{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;line-height:1;

@media(max-width:820px){.pa-split{grid-template-columns:1fr}}
.dsec-h{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);
  margin:6px 0 12px}
/* ---- account drawer (identical to PM tool) ---- */
.acd-scrim{position:fixed;inset:0;background:rgba(16,26,51,.34);display:none;justify-content:flex-end;z-index:80}

.p-none{font-size:12px;color:var(--faint)}
.p-chips{display:flex;gap:6px;flex-wrap:wrap}
.p-chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:4px 9px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink-2)}
.p-chip .cd{width:7px;height:7px;border-radius:50%}
.p-act{display:flex;align-items:center;gap:8px;justify-self:end}
.p-mini{font-size:12.5px;font-weight:600;color:var(--accent);background:none;border:0;cursor:pointer}
.dots-btn{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;color:var(--muted);border:1px solid var(--line);background:#fff;cursor:pointer;font-size:16px}
.dots-btn:hover{background:var(--surface-3)}
.p-empty{padding:22px;text-align:center;color:var(--muted);font-size:13px}

/* menu + toast + notice */
.menu{position:fixed;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);
  min-width:180px;z-index:80;display:none;padding:5px}
.menu.on{display:block}
.menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font-size:13px;padding:9px 11px;color:var(--ink)}
.menu button:hover{background:var(--surface-3)}
.menu button .ico{width:15px;height:15px;color:var(--muted)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--navy);color:#fff;padding:11px 18px;font-size:13px;font-weight:500;
  box-shadow:var(--shadow);opacity:0;transition:.22s;z-index:90;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.notice{max-width:560px;margin:12vh auto;background:var(--surface);border:1px solid var(--line);
  box-shadow:var(--shadow-sm);padding:34px}
.notice h2{font-size:19px;font-weight:800;letter-spacing:-.02em;margin-bottom:10px}
.notice p{color:var(--ink-2);font-size:13.5px;line-height:1.6;margin-bottom:10px}
.notice code{font-family:var(--mono);font-size:12px;background:var(--surface-3);padding:2px 6px}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;
  animation:sp .7s linear infinite;margin:14vh auto}
@keyframes sp{to{transform:rotate(360deg)}}

@media(max-width:860px){
  .login{grid-template-columns:1fr}.brand{padding:30px 26px}.brand-index{display:none}
  .tool-grid{grid-template-columns:1fr}.page{padding:24px 16px 48px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- Warning dialog for consequential actions ---------------------------
   Field edits stage-and-Save; the heavy security actions (deactivate,
   reactivate, delete, Master Admin changes) fire immediately — but only
   through this modal, which names exactly what is about to happen.
     warnModal({title, lead, points:[..], confirmLabel, tone:'danger'|'primary', onConfirm}) */
function warnModal(opt){
  const tone=opt.tone||'danger';
  const pts=(opt.points||[]).map(p=>`<div class="warn-li">${p}</div>`).join('');
  $('modal').innerHTML=`
    <div class="mhead">${ic(tone==='danger'?'trash':'users')}<h3>${esc(opt.title||'Are you sure?')}</h3><div class="x" onclick="closeModal()">${ic('x')}</div></div>
    <div class="mbody"><p class="warn-lead">${opt.lead||''}</p>${pts?`<div class="warn-callout ${tone==='danger'?'':'blue'}">${pts}</div>`:''}</div>
    <div class="mfoot"><button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn ${tone==='danger'?'danger':'accent'}" id="wm_go">${esc(opt.confirmLabel||'Confirm')}</button></div>`;
  $('wm_go').onclick=()=>{ closeModal(); opt.onConfirm&&opt.onConfirm(); };
  $('scrim').classList.add('on');
}
function go(hash){ location.hash=hash; }

/* =====================================================================
   BOOT + ROUTER
   ===================================================================== */
async function boot(){
  const cfg = window.EHS_CONFIG || {};
  const keysSet = cfg.url && cfg.anon
    && !String(cfg.url).startsWith('PASTE') && !String(cfg.anon).startsWith('PASTE');
  if(!keysSet) return renderConfigNotice('keys');
  if(!window.supabase) return renderConfigNotice('lib');
  if(EHS.onSignedOut) EHS.onSignedOut(function(){ renderLogin(); });
  const ssoErr=ssoErrorFromHash();
  if(ssoErr) return renderLogin(ssoErr);
  window.addEventListener('hashchange',route);
  root().innerHTML=`<div class="spin"></div>`;
  try{
    const me = await EHS.loadMe(true);
    if(!me) return renderLogin();
    route();
  }catch(e){ renderLogin(e.message); }
}
async function route(){

}

/* Friendly messages for OAuth failures that come back in the URL hash
   (#error=...&error_description=...) after the Microsoft round-trip. */
function ssoErrorFromHash(){
  const h=location.hash||'';
  if(h.indexOf('error')===-1) return null;
  const qp=new URLSearchParams(h.replace(/^#/,''));
  const desc=qp.get('error_description')||qp.get('error')||'';
  if(!desc) return null;
  try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
  const d=desc.toLowerCase();
  if(d.indexOf('signup')!==-1 && d.indexOf('not allowed')!==-1)
    return 'That Microsoft account isn\u2019t registered in this workspace. Ask a Master Admin to add you, then sign in again.';
  if(d.indexOf('banned')!==-1)
    return 'This account has been deactivated. Contact a Master Admin if you think this is a mistake.';
  return 'Microsoft sign-in failed: '+desc.replace(/\+/g,' ');
}

/* PM-tool-style avatar: square, tinted bg, coloured border + initials */
/* ---- Display picture (DP) -------------------------------------------------
   Photos live in one localStorage map keyed by email. index.html and pm.html
   are served from the same origin, so a photo set here shows up in the PM tool
   (and vice-versa) with no backend change. Best-effort mirrored to Supabase so
   it can follow the person across devices once profiles.avatar_url exists. */
const DP_KEY='ehs_avatars';
const ACCT_GLYPH='<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8.2" r="3.9"/><path d="M12 13.4c-4.1 0-7.4 2.6-7.4 5.9 0 .4.3.7.7.7h13.4c.4 0 .7-.3.7-.7 0-3.3-3.3-5.9-7.4-5.9Z"/></svg>';
let _dpCache=null;
function dpAll(){ if(_dpCache) return _dpCache;
  try{ _dpCache=JSON.parse(localStorage.getItem(DP_KEY)||'{}')||{}; }catch(e){ _dpCache={}; }
  return _dpCache; }
function dpGet(email){ if(!email) return null; return dpAll()[String(email).trim().toLowerCase()]||null; }
function dpSet(email,data){ if(!email) return; const m=dpAll(); const k=String(email).trim().toLowerCase();
  if(data) m[k]=data; else delete m[k];
  _dpCache=m;
  try{ localStorage.setItem(DP_KEY,JSON.stringify(m)); }catch(e){ toast('Storage is full — could not save the photo'); }
  try{ localStorage.setItem('ehs:dp:ping', String(Date.now())); }catch(e){}
}
try{ window.addEventListener('storage', e=>{ if(e && e.key===DP_KEY) _dpCache=null; }); }catch(e){}
function myDp(){ try{ const u=EHS.me(); return (u&&u.avatar_url)||(u?dpGet(u.email):null); }catch(e){ return null; } }
/* Crop to a centre square and re-encode small — a raw camera shot would blow
   the storage budget; 256px is plenty for a 76px avatar on a retina screen. */
function squarePhoto(file, px=256){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error('read failed'));
    fr.onload=()=>{ const img=new Image();
      img.onerror=()=>rej(new Error('not an image'));
      img.onload=()=>{ try{
        const side=Math.min(img.width,img.height);
        const c=document.createElement('canvas'); c.width=px; c.height=px;
        const g=c.getContext('2d'); g.imageSmoothingQuality='high';
        g.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,px,px);
        res(c.toDataURL('image/jpeg',0.85));
      }catch(e){ rej(e); } };
      img.src=fr.result; };
    fr.readAsDataURL(file);
  });
}
function avatarSq(name,size=30,email){
  const p=email?dpGet(email):null;
  if(p) return `<span class="av-sq" style="width:${size}px;height:${size}px"><img src="${p}" alt="${esc(name||'')}" loading="lazy"></span>`;
  return `<span class="av-sq av-glyph" style="width:${size}px;height:${size}px" title="${esc(name||'')}">${ACCT_GLYPH}</span>`; }
const AV_COLORS=['#C2410C','#0F6CBD','#0E8F5A','#7C3AED','#B96A00','#0891B2','#BE185D'];
function avColor(s){ let h=0; for(const c of (s||'?')) h=(h*31+c.charCodeAt(0))>>>0; return AV_COLORS[h%AV_COLORS.length]; }
function avColorHash(n){ return avColor(n); }

async function pickPhoto(){
  const f=$('dpFile'); if(!f) return;
  if(!f._wired){ f._wired=true;
    f.onchange=async e=>{ const file=e.target.files&&e.target.files[0]; if(!file) return;
      if(!/^image\//.test(file.type)){ toast('Pick a JPG or PNG image'); return; }
      if(file.size>2*1024*1024){ toast('Image is too large (max 2 MB)'); return; }
      const btn=$('dpUpload'); const label=btn?btn.textContent:'';
      if(btn){ btn.disabled=true; btn.textContent='Uploading\u2026'; }
      try{
        const data=await squarePhoto(file);
        const me=EHS.me(); if(!me){ toast('Not signed in'); return; }
        const url=await EHS.updateMyPhoto(data);   // Storage + profiles.avatar_url
        dpSet(me.email, url||data);                // local echo so the UI is instant
        await EHS.loadMe(true);
        toast('Photo updated'); renderSettings();
      }catch(err){ toast('Couldn\u2019t save the photo: '+(err&&err.message||'error')); }
      finally{ if(btn){ btn.disabled=false; btn.textContent=label; } }
    };
  }
  f.value=''; f.click();
}
async function removePhoto(){
  const me=EHS.me(); if(!me) return;
  warnModal({ title:'Remove photo', tone:'danger',
    lead:'Remove your profile photo? Your initials will show instead.',
    confirmLabel:'Remove photo',
    onConfirm:async()=>{
      try{
        await EHS.updateMyPhoto(null);
        dpSet(me.email,null);
        await EHS.loadMe(true);
        toast('Photo removed'); renderSettings();
      }catch(err){ toast('Couldn\u2019t remove the photo: '+(err&&err.message||'error')); }
    } });
}

  const name=(first+' '+last).trim(); const btn=$('st_saveProfile'); btn.disabled=true; btn.textContent='Saving\u2026';

function friendlyName(u){

function runCounters(root){
 const mult=()=>parseFloat(getComputedStyle(document.body).getPropertyValue('--sp'))||1;
 const els=[...root.querySelectorAll('.pcount,.dthru,.dsla,.scount,.opscount')];
 els.forEach(el=>{
   function cycle(){ const dur=1500*mult(), to=+el.dataset.to, d=(+(el.dataset.d||0))*1000*mult();
     setTimeout(()=>{ const t0=performance.now();
       (function fr(now){ const p=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-p,3);
         el.textContent=Math.round(to*e)+(el.dataset.suf||''); if(p<1) requestAnimationFrame(fr); })(t0); }, d);
     setTimeout(cycle, dur+2400*mult()); }
   cycle();
 });
 const ring=root.querySelector('.pmpct');
 if(ring){ function loop(){ const dur=1500*mult(), to=69, t0=performance.now();
     (function fr(now){ const p=Math.min(1,(now-t0)/dur); ring.textContent=Math.round(to*(1-Math.pow(1-p,3)))+'%'; if(p<1) requestAnimationFrame(fr); })(t0);
     setTimeout(loop, dur+2400*mult()); } loop(); }
}

/* ---------- Users: stage edits, save once ----------
   Every seg click used to fire its own API call (setMaster / grantAccess /
   revokeAccess) and re-render — slow, and a burst of writes if you changed a
   few things quickly. Now edits are staged against the loaded user and pushed
   in one go on Save. */
let _paDraft={}, _paDirty=false, _paEdit={};
function paEditToggle(id){ _paEdit[id]=!_paEdit[id]; if(_paEdit[id]) paDraftFor(id); paRefresh();
  const el=document.getElementById('pa_fn'); if(el){ el.focus(); el.select(); } }
function paDraftFor(id){
  const u=_users.find(x=>x.id===id); if(!u) return null;
  if(!_paDraft[id]){
    let fn=u.first_name, ln=u.last_name;
    if((fn==null||fn==='') && (ln==null||ln==='')){ const p=(u.full_name||'').trim().split(/\s+/); fn=p[0]||''; ln=p.slice(1).join(' ')||''; }
    _paDraft[id]={ is_master_admin:!!u.is_master_admin,
                   first_name:fn||'', last_name:ln||'', full_name:(u.full_name||''), email:(u.email||''),
                   tool_access:JSON.parse(JSON.stringify(u.tool_access||[])) };
  }
  return _paDraft[id];
}
function paSetField(id,field,val){ const d=paDraftFor(id); if(!d) return; if(d[field]===val) return; d[field]=val; paMarkDirty(); paSyncBar(); }
function paSetNameField(id,which,val){
  const d=paDraftFor(id); if(!d) return;
  if(which==='first') d.first_name=val; else d.last_name=val;
  d.full_name=((d.first_name||'')+' '+(d.last_name||'')).trim();   // mirror, for the header

function paSetMaster(id,val){

function paChipLabel(role){ return role==='admin'?'Admin':(role==='user'?'User':'No access'); }
function paAccessMenu(e,uid,tid){

    {label:'Admin', on:()=>paSetAccess(uid,tid,'admin')},

    {label:'No access', on:()=>paSetAccess(uid,tid,'none')},
  ]);
}
function paSetAccess(id,tid,role){
  const d=paDraftFor(id); if(!d) return;
  const had=(d.tool_access.find(x=>x.tool_id===tid)||{}).role||'none';
  if(had===role) return;
  if(role==='none') d.tool_access=d.tool_access.filter(x=>x.tool_id!==tid);
  else { const e=d.tool_access.find(x=>x.tool_id===tid); if(e) e.role=role; else d.tool_access.push({tool_id:tid, role}); }
  paMarkDirty(); paRefresh();
}
/* Save gate: field/tool-access edits save silently, but if the staged batch
   includes a Master Admin grant or removal, name it in a warning first —
   that's the one change in this panel with suite-wide consequences. */
async function paSaveAll(){
  const promo=[], demo=[];
  for(const id of Object.keys(_paDraft)){
    const u=_users.find(x=>x.id===id); const d=_paDraft[id]; if(!u||!d) continue;
    if(!!u.is_master_admin!==!!d.is_master_admin) (d.is_master_admin?promo:demo).push(u.full_name||u.email);
  }
  if(promo.length||demo.length){
    const pts=[];
    promo.forEach(n=>pts.push(`<b>${esc(n)}</b> becomes a Master Admin — full control over every tool and every user, including creating and deleting accounts.`));
    demo.forEach(n=>pts.push(`<b>${esc(n)}</b> loses Master Admin — drops to normal access based on their tool grants.`));
    warnModal({ title:promo.length?'Confirm Master Admin change':'Remove Master Admin',
      tone:promo.length?'danger':'primary',
      lead:'Saving these changes will apply the following immediately:',
      points:pts, confirmLabel:'Save changes', onConfirm:paApplyAll });
    return;
  }
  paApplyAll();
}
async function paApplyAll(){
  const btn=document.getElementById('pa_save'); if(btn){ btn.disabled=true; btn.textContent='Saving\u2026'; }
  let n=0;
  try{
    for(const id of Object.keys(_paDraft)){
      const u=_users.find(x=>x.id===id); const d=_paDraft[id]; if(!u||!d) continue;
      // name (first/last, source of truth) / email (auth identity)
      const nameChg=((d.first_name||'')!==(u.first_name||'')||(d.last_name||'')!==(u.last_name||''));
      const emailChg=(d.email!==undefined && d.email.trim()!==(u.email||''));
      if(emailChg && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email.trim())){ throw new Error('Enter a valid email address'); }
      if(nameChg||emailChg){
        const patch={};
        if(nameChg){ patch.first_name=d.first_name; patch.last_name=d.last_name; }
        if(emailChg){ patch.email=d.email.trim(); }
        await EHS.updateUser(id, patch);
        if(nameChg){ u.first_name=d.first_name; u.last_name=d.last_name; u.full_name=((d.first_name||'')+' '+(d.last_name||'')).trim(); }
        if(emailChg) u.email=d.email.trim(); n++;
      }
      if(!!u.is_master_admin!==d.is_master_admin){ await EHS.setMaster(id, d.is_master_admin); u.is_master_admin=d.is_master_admin; n++; }
      const before=u.tool_access||[], after=d.tool_access||[];
      for(const b of before){ if(!after.find(a=>a.tool_id===b.tool_id)){ await EHS.revokeAccess(id,b.tool_id); n++; } }
      for(const a of after){ const b=before.find(x=>x.tool_id===a.tool_id);
        if(!b || b.role!==a.role){ await EHS.grantAccess(id,a.tool_id,a.role); n++; } }
      u.tool_access=JSON.parse(JSON.stringify(after));
    }
    _paDraft={}; _paDirty=false; _paEdit={};
    toast(n?`Saved ${n} change${n===1?'':'s'}`:'Nothing to save');
    paRefresh();
  }catch(e){
    toast('Couldn\u2019t save: '+e.message);
    if(btn){ btn.disabled=false; btn.textContent='Save changes'; }
  }
}
function paDiscard(){ _paDraft={}; _paDirty=false; _paEdit={}; paRefresh(); }

function paGenPw(){ const c='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789'; let p=''; for(let i=0;i<12;i++)p+=c[Math.floor(Math.random()*c.length)]; const el=document.getElementById('pa_pw'); if(el) el.value=p+'!7'; }
async function paDoReset(id){ const el=document.getElementById('pa_pw'); const pw=(el&&el.value||'').trim(); const req=!!(document.getElementById('pa_req')&&document.getElementById('pa_req').checked);
  if(pw&&pw.length<6){ toast('Password must be at least 6 characters'); return; }
  try{ const out=await EHS.resetPassword(id,pw,req); const u=_users.find(x=>x.id===id); if(el) el.value=''; showCreds((u&&u.email)||'', (out&&out.password)||pw); toast('Password reset'); }
  catch(e){ toast('Couldn\u2019t reset: '+e.message); } }
function userRow(u){
  const acc=(u.tool_access||[]);
  const access=u.is_master_admin
    ? '<span class="p-all">All tools</span>'
    : `<div class="p-chips">${ALL_IDS.map(id=>{const a=acc.find(x=>x.tool_id===id); if(!a)return ''; const t=tool(id);
        return `<span class="p-chip"><span class="cd" style="background:${t.accent}"></span>${t.code} \u00b7 ${a.role==='admin'?'Admin':'User'}</span>`;}).filter(Boolean).join('')||'<span class="p-none">No tools yet</span>'}</div>`;
  return `<div class="p-row">
    <div class="p-person">${avatarSq(u.full_name||u.email,40,u.email)}
      <div><div class="p-nm">${esc(u.full_name||'\u2014')}</div><div class="p-em">${esc(u.email)}</div></div></div>
    <div class="p-access">${access}</div>
    <div class="p-act"><button class="p-mini" onclick="openAccess('${u.id}')">Manage</button>
      <button class="dots-btn" title="More" onclick="userMenu('${u.id}',event)">\u22ef</button></div>
  </div>`;
}
function userMenu(id, e){
  e.stopPropagation();
  const u=_users.find(x=>x.id===id); if(!u) return;
  const meId=EHS.me()&&EHS.me().id;
  const items=[{label:u.is_master_admin?'Remove Master Admin':'Make Master Admin', icon:'users',
      on:()=>doSetMaster(id, !u.is_master_admin)}];
  items.push({label:'Reset password', icon:'settings', on:()=>openReset(id)});
  if(id!==meId) items.push({label:'Delete user', icon:'trash', danger:true, on:()=>doDeleteUser(id)});
  openMenu(e.currentTarget, items);
}
function openReset(id){
  const u=_users.find(x=>x.id===id); if(!u) return;
  $('modal').innerHTML=`
    <div class="mhead">${ic('settings')}<h3>Reset password</h3><div class="x" onclick="closeModal()">${ic('x')}</div></div>
    <div class="mbody">
      <div class="field"><label>User</label><input type="text" value="${esc(u.full_name||u.email)}" disabled style="opacity:.6"></div>
      <div class="field"><label>New temporary password</label>
        <div class="pwrow"><input id="rs_pw" type="text" placeholder="Leave blank to auto-generate"><button class="btn sm" type="button" onclick="genResetPw()">Generate</button></div>
        <div class="hint">Share this with the user securely. They sign in with it right away.</div></div>
      <label class="master-callout" style="margin-top:2px"><input type="checkbox" id="rs_require" checked>
        <span>Require them to <b>set their own password</b> on next sign-in.</span></label>
    </div>
    <div class="mfoot"><button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn accent" id="rs_btn" onclick="doReset('${u.id}')">Reset password</button></div>`;
  $('scrim').classList.add('on');
}
function genResetPw(){ const c='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789'; let p=''; for(let i=0;i<12;i++) p+=c[Math.floor(Math.random()*c.length)]; $('rs_pw').value=p+'!7'; }
async function doReset(id){
  const pw=($('rs_pw').value||'').trim(); const req=!!($('rs_require')&&$('rs_require').checked);
  if(pw && pw.length<6){ toast('Password must be at least 6 characters'); $('rs_pw').focus(); return; }
  const btn=$('rs_btn'); btn.disabled=true; btn.textContent='Resetting\u2026';
  try{ const out=await EHS.resetPassword(id, pw, req); closeModal();
    const u=_users.find(x=>x.id===id);
    showCreds((u&&u.email)||'', (out&&out.password)||pw);
    toast('Password reset');
  }catch(e){ btn.disabled=false; btn.textContent='Reset password'; toast('Couldn\u2019t reset: '+e.message); }
}
async function doSetMaster(id,val){
  const u=_users.find(x=>x.id===id); const who=esc(u?(u.full_name||u.email):'this user');
  const apply=async()=>{ try{ await EHS.setMaster(id,val); toast(val?'Now a Master Admin':'Master Admin removed'); renderPeople(); }
    catch(e){ toast(e.message); } };
  if(val){
    warnModal({ title:'Make Master Admin', tone:'danger',
      lead:`Make <b>${who}</b> a Master Admin?`,
      points:['Full control over every tool and every user.','Can create, reset, and delete accounts — including appointing other Master Admins.'],
      confirmLabel:'Make Master Admin', onConfirm:apply });
  }else{
    warnModal({ title:'Remove Master Admin', tone:'primary',
      lead:`Remove Master Admin from <b>${who}</b>?`,
      points:['They drop to normal access based on their tool grants.'],
      confirmLabel:'Remove Master Admin', onConfirm:apply });
  }
}
async function doDeleteUser(id){
  const u=_users.find(x=>x.id===id); const who=esc(u?(u.full_name||u.email):'this user');
  warnModal({ title:'Delete user', tone:'danger',
    lead:`Permanently delete <b>${who}</b>?`,
    points:['Removes their account, sign-in, and profile.','Their past tickets and worklogs stay, but show as an unknown user.','This cannot be undone.'],
    confirmLabel:'Delete permanently',
    onConfirm:async()=>{ try{ await EHS.deleteUser(id); toast('User deleted'); renderPeople(); }
      catch(e){ toast('Delete failed: '+e.message); } } });
}
async function doSetStatus(id, status){
  const u=_users.find(x=>x.id===id); const who=esc(u?(u.full_name||u.email):'this user');
  const apply=async()=>{ try{ await EHS.setStatus(id, status); toast(status==='deactivated'?'User deactivated':'User reactivated'); renderPeople(); }
    catch(e){ toast('Couldn\u2019t update: '+(e&&e.message||e)); } };
  if(status==='deactivated'){
    warnModal({ title:'Deactivate user', tone:'danger',
      lead:`Deactivate <b>${who}</b>?`,
      points:['They\u2019ll be signed out and blocked from logging in (password and Microsoft).','They lose all tool access.','Their tickets and worklogs stay on their name. You can reactivate later.'],
      confirmLabel:'Deactivate user', onConfirm:apply });
  }else{
    warnModal({ title:'Reactivate user', tone:'primary',
      lead:`Reactivate <b>${who}</b>?`,
      points:['They\u2019ll be able to sign in again.','You\u2019ll need to re-grant tool access separately.'],
      confirmLabel:'Reactivate user', onConfirm:apply });
  }
}

/* ---- edit one user's access ---- */
function openAccess(userId){
  const u=_users.find(x=>x.id===userId); if(!u) return;
  const acc=(u.tool_access||[]);
  const rows=TOOLS.map(t=>{
    const cur=(acc.find(x=>x.tool_id===t.id)||{}).role||'none';
    return `<div class="trow"><div class="mid"><div class="tn">${esc(t.name)}</div><div class="tt">${esc(t.tagline)}</div></div>
      <select class="acc-sel" data-tool="${t.id}">
        <option value="none"${cur==='none'?' selected':''}>No access</option>
        <option value="user"${cur==='user'?' selected':''}>User</option>
        <option value="admin"${cur==='admin'?' selected':''}>Admin</option>
      </select></div>`;
  }).join('');
  $('modal').innerHTML=`
    <div class="mhead">${avatarSq(u.full_name||u.email,30,u.email)}
      <h3>${esc(u.full_name||u.email)}</h3><div class="x" onclick="closeModal()">${ic('x')}</div></div>
    <div class="mbody">
      <label class="master-callout"><input type="checkbox" id="ac_master" ${u.is_master_admin?'checked':''} onchange="toggleMasterEdit()">
        <span>Make this person a <b>Master Admin</b> \u2014 full access to every tool, plus People &amp; Access.</span></label>
      <div id="ac_accsec"><div class="dsec-h" style="margin-top:18px">Tool access</div><div class="tlist">${rows}</div></div>
      <div id="ac_masternote" class="hint" style="display:none;margin-top:12px">Master Admins have access to all tools.</div>
    </div>
    <div class="mfoot"><button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn accent" id="acc_save" onclick="saveAccess('${u.id}')">Save changes</button></div>`;
  toggleMasterEdit();
  $('scrim').classList.add('on');
}
function toggleMasterEdit(){
  const on=$('ac_master').checked;
  $('ac_accsec').style.display=on?'none':'';
  $('ac_masternote').style.display=on?'':'none';
}
async function saveAccess(userId){
  const u=_users.find(x=>x.id===userId);
  const master=$('ac_master').checked;
  const btn=$('acc_save'); btn.disabled=true; btn.textContent='Saving\u2026';
  try{
    if(master!==!!u.is_master_admin) await EHS.setMaster(userId,master);
    if(!master){
      const sels=Array.from(document.querySelectorAll('#modal .acc-sel'));
      for(const s of sels){
        const tid=s.dataset.tool, want=s.value;
        const had=((u.tool_access||[]).find(x=>x.tool_id===tid)||{}).role||'none';
        if(want===had) continue;
        if(want==='none') await EHS.revokeAccess(userId,tid);
        else await EHS.grantAccess(userId,tid,want);
      }
    }
    closeModal(); toast('Access updated'); renderPeople();
  }catch(err){ btn.disabled=false; btn.textContent='Save changes'; toast('Save failed: '+err.message); }
}

/* ---- add a new user ---- */
function openInvite(){
  const rows=TOOLS.map(t=>`<div class="trow">
    <div class="mid"><div class="tn">${esc(t.name)}</div><div class="tt">${esc(t.tagline)}</div></div>
    <select class="acc-sel" data-tool="${t.id}">
      <option value="none">No access</option><option value="user">User</option><option value="admin">Admin</option>
    </select></div>`).join('');
  $('modal').innerHTML=`
    <div class="mhead">${ic('plus')}<h3>Add user</h3><div class="x" onclick="closeModal()">${ic('x')}</div></div>
    <div class="mbody">
      <div class="frow2">
        <div class="field"><label>First name <span style="color:var(--crit)">*</span></label><input id="iv_first" type="text" placeholder="First"></div>
        <div class="field"><label>Last name <span style="color:var(--crit)">*</span></label><input id="iv_last" type="text" placeholder="Last"></div>
      </div>
      <div class="field"><label>Email <span style="color:var(--crit)">*</span></label><input id="iv_email" type="email" placeholder="person@eduhubspot.com"></div>
      <div class="field"><label>Temporary password</label>
        <div class="pwrow"><input id="iv_pw" type="text" placeholder="Leave blank to auto-generate"><button class="btn sm" type="button" onclick="genPw()">Generate</button></div>
        <div class="hint">The user signs in with this straight away and can change it later.</div></div>
      <label class="master-callout" style="margin-top:4px"><input type="checkbox" id="iv_require">
        <span>Require the user to <b>set a new password</b> on their first sign-in.</span></label>
      <label class="master-callout"><input type="checkbox" id="iv_master" onchange="toggleMasterCreate()">
        <span>Make this person a <b>Master Admin</b> \u2014 full access to every tool, plus People &amp; Access.</span></label>
      <div id="iv_accsec"><div class="dsec-h" style="margin-top:18px">Tool access</div><div class="tlist">${rows}</div></div>
      <div id="iv_masternote" class="hint" style="display:none;margin-top:12px">This person will have access to all tools as a Master Admin.</div>
    </div>
    <div class="mfoot"><button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn accent" id="iv_btn" onclick="sendInvite()">${ic('plus')} Create user</button></div>`;
  $('scrim').classList.add('on');
}
function genPw(){
  const c='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
  let p=''; for(let i=0;i<12;i++) p+=c[Math.floor(Math.random()*c.length)];
  $('iv_pw').value=p+'!7';
}
function toggleMasterCreate(){
  const on=$('iv_master').checked;
  $('iv_accsec').style.display=on?'none':'';
  $('iv_masternote').style.display=on?'':'none';
}
function showCreds(email,password){
  $('modal').innerHTML=`
    <div class="mhead">${ic('users')}<h3>User created</h3><div class="x" onclick="closeModal()">${ic('x')}</div></div>
    <div class="mbody">
      <p style="font-size:13.5px;color:var(--ink-2);line-height:1.55">Share these sign-in details with the person. They can change the password after their first sign-in.</p>
      <div class="field"><label>Email</label><input type="text" readonly value="${esc(email)}" onclick="this.select()"></div>
      <div class="field"><label>Temporary password</label><input type="text" readonly value="${esc(password)}" onclick="this.select()"></div>
    </div>
    <div class="mfoot"><button class="btn accent" id="cr_copy">Copy details</button>
      <button class="btn" onclick="closeModal()">Done</button></div>`;
  // Bind via closure — the credentials are never serialized into an HTML
  // attribute, so a quote/backtick in the value can't break out and inject.
  const _cp=$('modal').querySelector('#cr_copy');
  if(_cp) _cp.onclick=()=>copyCreds(email,password);
  $('scrim').classList.add('on');
}
function copyCreds(email,password){
  const txt='Email: '+email+'\nTemporary password: '+password;
  navigator.clipboard&&navigator.clipboard.writeText(txt); toast('Copied');
}
function pickInvite(btn,toolId,role){
  btn.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('on')); btn.classList.add('on');
  window._invite[toolId]=role;
}
async function sendInvite(){
  const first=($('iv_first').value||'').trim(), last=($('iv_last').value||'').trim();
  const email=($('iv_email').value||'').trim(), pw=($('iv_pw').value||'').trim();
  if(!first){ toast('Enter a first name'); $('iv_first').focus(); return; }
  if(!last){ toast('Enter a last name'); $('iv_last').focus(); return; }
  if(!email){ toast('Enter an email'); $('iv_email').focus(); return; }
  if(pw && pw.length<6){ toast('Password must be at least 6 characters'); $('iv_pw').focus(); return; }
  const name=(first+' '+last).trim();
  const isMaster=!!($('iv_master')&&$('iv_master').checked);
  const requireChange=!!($('iv_require')&&$('iv_require').checked);
  const grants=isMaster?[]:Array.from(document.querySelectorAll('#modal .acc-sel'))
    .map(s=>({tool_id:s.dataset.tool, role:s.value})).filter(g=>g.role&&g.role!=='none');
  const btn=$('iv_btn'); btn.disabled=true; btn.textContent='Creating\u2026';
  try{
    const out=await EHS.addUser(email,name,grants,pw,isMaster,requireChange,first,last);
    renderPeople();
    showCreds(out.email||email, out.password||pw);
  }catch(e){ btn.disabled=false; btn.innerHTML=`${ic('plus')} Create user`; toast('Couldn\u2019t create user: '+e.message); }
}

/* ---------------- menu / global ---------------- */
function openMenu(anchor,items){
  const m=$('menu'); m.innerHTML=items.map((it,i)=>`<button data-i="${i}"${it.danger?' style="color:var(--crit)"':''}>${it.icon?ic(it.icon):''}${esc(it.label)}</button>`).join('');
  const r=anchor.getBoundingClientRect(); m.style.left=(r.right-180)+'px'; m.style.top=(r.bottom+6)+'px'; m.classList.add('on');
  m.querySelectorAll('button').forEach((b,i)=>b.onclick=(e)=>{ e.stopPropagation(); m.classList.remove('on'); items[i].on&&items[i].on(); });
}
document.addEventListener('click',()=>$('menu').classList.remove('on'));
window.addEventListener('storage', e=>{ if(e.key==='ehs:signout'){ location.reload(); } });
$('scrim').addEventListener('click',e=>{ if(e.target===$('scrim')) closeModal(); });

boot();
</script>
